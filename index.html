<style>
:root{--ink:#16202e;--mut:#5d6b7c;--line:#dde3ea;--bg:#f2f5f8;--card:#fff;--brand:#1f3a5f;--acc:#b8742a;--ok:#1b7a4b;--bad:#b3261e;--warn:#9a6700}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:var(--fs,14px);line-height:1.45;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
header{background:linear-gradient(120deg,var(--h1),var(--h2));color:var(--ht,#fff);padding:20px 28px}
.hb{display:flex;align-items:center;gap:14px}#logo{height:46px;max-width:130px;object-fit:contain;border-radius:6px;background:#fff;padding:3px}
header h1{margin:0;font-size:26px;letter-spacing:.2px}
header p{margin:4px 0 0;color:var(--hp,#c4d0df);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line)}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
.btn.s{background:#fff;color:var(--brand)}
.btn.d{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.xs{padding:3px 9px;font-size:12px}
.btn:hover{filter:brightness(.94)}
#drop{flex:1;min-width:220px;border:1.5px dashed #9fb0c5;border-radius:6px;padding:8px 12px;color:var(--mut);text-align:center}
#drop.on{background:#eaf1fa;border-color:var(--brand)}
#st{padding:6px 28px;font-size:13px;color:var(--mut);min-height:30px}
#st .e{color:var(--bad);display:block}
nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;padding:12px 14px;cursor:pointer;font:inherit;color:var(--mut);border-bottom:3px solid transparent;font-weight:600}
nav button.on{color:var(--brand);border-color:var(--acc)}
main{padding:20px 28px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:12px 14px}
.k small{color:var(--mut);display:block}.k b{font-size:21px}.k i{font-style:normal;font-size:12px;color:var(--bad);display:block}
.adjneg{color:#a33;font-weight:700}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:16px}
.sc{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{padding:7px 10px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#eef2f7;font-size:12.5px;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;background:#f6f8fb;position:sticky;bottom:0}
.em{color:var(--mut);text-align:center;padding:18px}
.bd{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.bd.ok{background:#e3f4ea;color:var(--ok)}.bd.w{background:#fdf0d8;color:var(--warn)}.bd.b{background:#fbe4e2;color:var(--bad)}
.br{display:grid;grid-template-columns:minmax(90px,200px) 1fr 100px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{background:#edf0f4;border-radius:4px;height:14px}.bt i{display:block;height:100%;background:var(--brand);border-radius:4px}
.br b{text-align:right;font-variant-numeric:tabular-nums}
.in,select{padding:7px 9px;border:1px solid #c5cfdb;border-radius:6px;font:inherit;background:#fff;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.note{color:var(--mut);font-size:12.5px;margin:0 0 10px}
.ban{background:#fdf0d8;border:1px solid #edc77d;color:#6b4a00;padding:10px 14px;border-radius:6px;margin-bottom:16px}
dialog{border:1px solid var(--line);border-radius:8px;padding:16px}dialog::backdrop{background:rgba(10,20,35,.45)}
#gate{position:fixed;inset:0;background:linear-gradient(120deg,var(--h1),var(--h2));display:none;align-items:center;justify-content:center;z-index:50}
body.gated #gate{display:flex}body.gated #app{display:none}
.gbox{background:#fff;border-radius:10px;padding:26px;width:min(430px,92vw)}.gbox h2{margin:0 0 2px;font-size:20px}.gbox .in{display:block;width:100%;margin:8px 0}
.gm{color:var(--bad);min-height:20px;margin:8px 0 0}.who{margin-left:auto;color:var(--mut);font-size:12.5px}
body.super header{border-bottom:5px solid #b8742a}
.ban.bad{background:#fbe4e2;border-color:#e0a09b;color:#8a1c14}.ban.ok{background:#e3f4ea;border-color:#9fd0b4;color:#14573a}
.chip{display:inline-block;background:#eef2f7;border-radius:12px;padding:2px 9px;margin:2px;font-size:12.5px}.chip .x{cursor:pointer;color:var(--bad);font-weight:700;margin-left:4px;text-decoration:none}
.gtabs{display:flex;gap:16px;margin:12px 0 4px}a.lnk.on{font-weight:700;text-decoration:none;color:var(--ink)}
body:not(.ed) .ed{display:none!important}
.pie{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.pc{width:230px;max-width:100%}.lgs{flex:1;min-width:210px}
.lg{display:grid;grid-template-columns:14px 1fr auto 52px;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.lg:hover,.lg.on{background:#eef2f7}.lg i{width:12px;height:12px;border-radius:3px}.lg em{font-style:normal;color:var(--mut);text-align:right}.lg b{font-variant-numeric:tabular-nums}
@media (max-width:700px){header{padding:14px 16px}header h1{font-size:19px}header p{display:none}
.bar{padding:10px 14px;gap:6px}.bar .btn{padding:7px 10px;font-size:13px}#drop{display:none}
nav{padding:0 6px;overflow-x:auto;flex-wrap:nowrap;white-space:nowrap}nav button{padding:11px 10px;flex:none}
main{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.k b{font-size:17px}.g2{grid-template-columns:1fr}
.br{grid-template-columns:84px 1fr 86px}.who{margin-left:0;width:100%}.sc{max-height:70vh}#st{padding:6px 14px}}
a.lnk{color:var(--brand);cursor:pointer;font-size:12.5px;text-decoration:underline}

/* Brand font: EB Garamond (SIL Open Font License 1.1), embedded so it works offline */
:root{--fh:'HBSerif','EB Garamond',Garamond,'Times New Roman',serif}
body:not(.f-sys) header h1,body:not(.f-sys) .gbox h2{font-family:var(--fh);font-weight:500;font-size:30px;line-height:1.15}
body:not(.f-sys) .gbox h2{font-size:25px;margin:0 0 8px}
body.tr-wide header h1,body.tr-wide .gbox h2{letter-spacing:.2em}
body.tr-norm header h1,body.tr-norm .gbox h2{letter-spacing:.02em}
body:not(.f-sys) header p{font-family:var(--fh);font-size:15px;letter-spacing:.08em}
body.f-head .card h3,body.f-head nav button,body.f-head .k small{font-family:var(--fh)}
body.f-head .card h3{font-size:19px;font-weight:600;letter-spacing:.03em}
body.f-head nav button{font-size:16px;letter-spacing:.04em}
body.f-head .k small{font-size:14.5px;letter-spacing:.03em}
body.f-all,body.f-all input,body.f-all select,body.f-all button,body.f-all textarea,body.f-all dialog{font-family:var(--fh);font-feature-settings:'lnum' 1,'tnum' 1}
body.f-all{font-size:calc(var(--fs,14px) + 2px)}
body.f-all .card h3{font-weight:600;letter-spacing:.03em}
@media (max-width:700px){body:not(.f-sys) header h1{font-size:21px}body.tr-wide header h1,body.tr-wide .gbox h2{letter-spacing:.08em}}
/* Minimal interface (default) */
body.ui-min header{border-bottom:1px solid #e8e8e4;padding:20px 28px}
body.ui-min .bar{background:transparent;border-bottom:0;padding:12px 28px 6px}
body.ui-min .btn{border-radius:8px;font-weight:500}
body.ui-min .btn.s{background:#fff;color:var(--ink);border-color:#dcdfe3}
body.ui-min .btn.d{background:#fff;color:var(--bad);border-color:#e6c4c1}
body.ui-min #drop{border:0;color:#9aa1ab;font-size:12.5px;padding:4px 6px;text-align:left;flex:0 1 auto;min-width:0}

<script>
/* ===== SETTINGS you can edit (see the guide) ===== */
const LICENCE_END='2026-11-30';   // app stops working after this date (yyyy-mm-dd) until an administrator renews it
const SETUP_KEY='HBK-2BA3-3059'; // needed once to create the first administrator; keep it private
const DATA_FILE='hb_data.js';   // shared data file that sits next to this page (published by an editor)
const KDF_ITER=250000;        // password hardening strength
const IDLE_MINUTES=180;          // automatic sign-out after this many idle minutes (180 = 3 hours)
/* ================================================= */
/*CORE-START*/
const num=v=>{const s=String(v==null?'':v).replace(/[,\s]/g,'');return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN};
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const norm=k=>String(k||'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
function splitLine(line,d){const o=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===d){o.push(c);c=''}else c+=ch}o.push(c);return o}
function detectDelim(t){const L=t.split(/\r?\n/).filter(x=>x.trim()).slice(0,15).join('\n');const n=d=>L.split(d).length-1;const c=[[';',n(';')],[',',n(',')],['\t',n('\t')],['|',n('|')]].sort((a,b)=>b[1]-a[1]);return c[0][1]?c[0][0]:';'}
const isoDate=s=>{const m=/(\d{2})\/(\d{2})\/(\d{2,4})/.exec(s||'');return m?((m[3].length===2?'20':'')+m[3]+'-'+m[2]+'-'+m[1]):''};
function parseReport(text,fname){
  text=text.replace(/^\uFEFF/,'');
  if(!/RESTAURANT SUMMARY|CATEGORY REVENUES/i.test(text))throw new Error('Not a Restaurant Summary report');
  const d=detectDelim(text);
  const rows=text.split(/\r?\n/).map(l=>{const c=splitLine(l,d).map(x=>x.trim());while(c.length&&c[c.length-1]==='')c.pop();return c});
  const R={file:fname,src:'Restaurant Summary',tenders:[],cats:[],items:[],vat:0,net:0};let vatSeen=false;
  const pm=/(\d{2}\/\d{2}\/\d{2,4})\s*-\s*(\d{2}\/\d{2}\/\d{2,4})/.exec(rows[0]?rows[0].join(' '):'');
  R.from=pm?isoDate(pm[1]):'';R.to=pm?isoDate(pm[2]):'';
  const sep=rows.findIndex(r=>r.length&&/^-{3,}/.test(r[0]));
  if(sep>=0){for(let j=sep+1;j<rows.length;j++){if(rows[j].length&&!/^-{3,}/.test(rows[j][0])){R.raw=rows[j][0];break}}}
  if(!R.raw)throw new Error('Location / event name not found');
  R.key=norm(R.raw);
  const ci=rows.findIndex(r=>/^company id/i.test(r[0]||''));
  if(ci>=0){R.company=rows[ci][1]||'';R.group=(rows[ci+1]&&rows[ci+1][0])||''}
  let mode='',cIdx={},cur=null,parent=null,pend='';const ent=[];
  for(const c of rows){
    if(!c.length){if(mode==='cat'||mode==='vat'||mode==='pay')mode='';continue}
    const a=c[0],al=a.toLowerCase();
    if(/^-{3,}/.test(a))continue;
    if(mode==='pay'){
      if(al==='type')continue;
      if(al==='total'){mode='';continue}
      if(c.length>=5){const n=c.slice(-4).map(num);if(!isNaN(n[1])){
        if(a){parent={name:a,kids:0};ent.push({name:a,group:a,count:n[0]||0,amount:n[1],tips:n[2]||0,total:n[3]||0,child:false,p:parent})}
        else{if(parent)parent.kids++;ent.push({name:c[1],group:parent?parent.name:c[1],count:n[0]||0,amount:n[1],tips:n[2]||0,total:n[3]||0,child:true,p:parent})}}}
      continue}
    if(mode==='vat'){
      if(/rate/i.test(a))continue;
      if(/%/.test(a)){const n=num(c[1]),t=num(c[2]);if(!isNaN(t)){R.net+=isNaN(n)?0:n;R.vat+=t;vatSeen=true}}
      continue}
    if(mode==='cat'){
      if(/^(ticket void|correction)/i.test(a)){mode='';continue}
      const ix=(k,dv)=>cIdx[k]!==undefined?cIdx[k]:dv;
      const P=ix('PRODUCT',2),PR=ix('PRICE',4),Q=ix('#',5),T=ix('TOTAL',6),TX=cIdx['TAX']!==undefined?cIdx['TAX']:ix('VAT',10);
      if(a){cur={name:a,qty:num(c[Q]),total:num(c[T]),vat:num(c[TX]),gross:0,iqty:0,disc:0,discVat:0};R.cats.push(cur);pend='';continue}
      let name=c[P]||'';if(!name)continue;
      if(!cur){cur={name:'Uncategorised',qty:NaN,total:NaN,vat:NaN,gross:0,iqty:0,disc:0,discVat:0};R.cats.push(cur)}
      let tot=num(c[T]),tax=num(c[TX]),qty=num(c[Q]);
      if(/^discount\b/i.test(name)){cur.disc+=Math.abs(isNaN(tot)?0:tot);cur.discVat+=Math.abs(isNaN(tax)?0:tax);continue}
      if(isNaN(qty)&&isNaN(tot)){pend+=name+' ';continue}
      name=(pend+name).trim();pend='';
      const m=name.match(/^(.*?)\s*\[\s*([\d.]+)%\s*:\s*(-?[\d,.]+)\s*\(\s*(-?[\d,.]+)\s*\)\s*\]\s*$/);
      let rate=num(c[cIdx['TAX RATE']!==undefined?cIdx['TAX RATE']:9]);
      if(m){name=m[1];rate=parseFloat(m[2]);if(isNaN(tot))tot=num(m[3].replace(/,/g,''));tax=num(m[4].replace(/,/g,''))}
      if(isNaN(tot))continue;if(isNaN(tax))tax=0;if(isNaN(qty))qty=0;
      R.items.push({cat:cur.name,name,price:num(c[PR]),qty,total:tot,vat:tax,net:r2(tot-tax),rate});
      cur.gross+=tot;cur.iqty+=qty;continue}
    if(/^(tax|vat)$/i.test(a)){mode='vat';continue}
    if(/^payments and tips/i.test(a)){mode='pay';parent=null;continue}
    if(/^category revenues/i.test(a)){mode='hdr';continue}
    if(mode==='hdr'&&/^category$/i.test(a)){cIdx={};c.forEach((h,i)=>{cIdx[h.toUpperCase()]=i});mode='cat';continue}
    if(c.length>1&&/:$/.test(a)){
      const k=a.replace(/^[+\-=\s]+/,'').toLowerCase(),v=num(c[1]);
      if(/(?:adjustment|credit memo|credit note|sales reduction)/i.test(k)){
        const rawAdj=Math.abs(v);
        if(!isNaN(rawAdj)&&rawAdj){R.adjustmentsFromFile=r2((R.adjustmentsFromFile||0)-rawAdj);continue}
      }
      if(isNaN(v))continue;
      if(k==='restaurant revenue:')R.restRev=v;
      else if(k==='revenue without discounts:')R.revWithout=v;
      else if(k==='total discounts:')R.discounts=v;
      else if(k==='gross sales:')R.gross=v;
      else if(k==='customers:')R.customers=v;
      else if(k==='tickets:')R.tickets=v;
      else if(k==='total revenue:'&&/^=/.test(a))R.totalRev=v;}
  }
  R.tenders=ent.filter(e=>e.child||e.p.kids===0).map(e=>({name:e.name,group:e.group,count:e.count,amount:e.amount,tips:e.tips,total:e.total}));
  if(R.gross===undefined)R.gross=R.totalRev!==undefined?R.totalRev:(R.restRev||0);
  R.discounts=R.discounts||0;R.customers=R.customers||0;R.tickets=R.tickets||0;
  if(R.revWithout===undefined)R.revWithout=r2(R.gross+R.discounts);
  if(!vatSeen){R.vat=r2(R.items.reduce((s,i)=>s+i.vat,0)-R.cats.reduce((s,c)=>s+c.discVat,0));R.net=r2(R.gross-R.vat)}
  R.vat=r2(R.vat);R.net=r2(R.net);
  R.itemsGross=r2(R.items.reduce((s,i)=>s+i.total,0));
  R.cats.forEach(c=>{c.gross=r2(c.gross);c.disc=r2(c.disc);c.discVat=r2(c.discVat);
    if(isNaN(c.total))c.total=r2(c.gross-c.disc);
    if(isNaN(c.vat))c.vat=r2(R.items.filter(i=>i.cat===c.name).reduce((s,i)=>s+i.vat,0)-c.discVat);
    if(isNaN(c.qty))c.qty=c.iqty});
  if(!R.items.length&&!R.cats.length&&!R.tenders.length)throw new Error('No category or payment data found');
  return R}
function checksFor(r){
  // Reconciliation is intentionally LIGHTSPEED / Restaurant Summary only.
  // Simphony remains available for sales, tender, category and item analysis,
  // but Simphony is excluded from reconciliation checks.
  if(!(r.src==='Restaurant Summary'||r.src==='Lightspeed'))return [];
  const S=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
  const ig=S(r.items,i=>i.total),dsc=S(r.cats,c=>c.disc),dv=S(r.cats,c=>c.discVat),iv=S(r.items,i=>i.vat),tl=S(r.tenders,t=>t.amount);
  const fileAdj=Number(r._fileAdjustment)||0;
  const grossBeforeAdjustment=r2(r.gross-fileAdj);
  const C=(name,exp,act,tol)=>({name,exp:r2(exp),act:r2(act),diff:r2(act-exp),ok:Math.abs(act-exp)<=(tol||0.05)+1e-9});
  const grossExpected=r2(r.net+(r.vat||0)+(r.svc||0));
  return [
    C(fileAdj?'Revenue: items less discounts vs report revenue before adjustment':'Revenue: items less discounts vs report revenue',grossBeforeAdjustment,ig-dsc),
    C(fileAdj?'Discount: revenue before discounts less discounts vs final revenue before adjustment':'Discount: revenue before discounts less discounts vs final revenue',grossBeforeAdjustment,r.revWithout-r.discounts),
    C('Discount rows vs report total discounts',r.discounts,dsc),
    C(fileAdj?'VAT: net revenue + VAT vs gross revenue before adjustment':'VAT: net revenue + VAT vs gross revenue',grossBeforeAdjustment,r.net+r.vat),
    C('VAT: item VAT (after discount VAT) vs report VAT',r.vat,iv-dv,0.05+0.005*(r.items.length+r.cats.length)),
    C('Tender: payments vs net sales + tax + service charge',grossExpected,tl)
  ];
}

/* ----- Simphony (Oracle MICROS) exports: Daily Outlet Sales report, Sales Data and Sales Mix workbooks ----- */
const serialISO=n=>new Date(Math.round((n-25569)*864e5)).toISOString().slice(0,10);
function simDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date)return isNaN(v)?'':v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number')return v>20000&&v<80000?serialISO(v):'';
  const s=String(v).trim();let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/.exec(s);if(!m)return '';
  let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;let mo=a,d=b;if(a>12){mo=b;d=a}
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
const nv=v=>typeof v==='number'?v:(v==null?0:(isNaN(num(v))?0:num(v)));
const sx=v=>String(v==null?'':v).trim();
function simKind(h){if(h.includes('tender name'))return 'tender';if(h.includes('order type name'))return 'ot';if(h.includes('day part name'))return 'dp';if(h.includes('menu item name'))return 'mix';if(h.includes('major group name'))return 'mg';if(h.includes('checks count')&&h.includes('sales net vat'))return 'main';return ''}
function simBlocks(rows){
  const B={main:[],tender:[],ot:[],dp:[],mg:[],mix:[]};let idx=null,kind='',bad=0,total=0,dr=0;const seenRow=new Set();
  for(const r of rows){if(!r)continue;
    if(sx(r[0]).toLowerCase()==='location name'){const h2=r.map(x=>sx(x).toLowerCase());idx={};h2.forEach((x,i)=>{if(x&&idx[x]===undefined)idx[x]=i});kind=simKind(h2);continue}
    if(!idx||!kind)continue;
    const loc=sx(r[0]);if(!loc||/^(grand )?total/i.test(loc))continue;

function brRows(L){
  const m=new Map();
  const key=(ent,br,ev)=>String(ent)+'|'+String(br)+'|'+String(ev);
  const ensure=(ent,br,ev)=>{const k=key(ent,br,ev);if(!m.has(k))m.set(k,{Entity:ent,Branch:br,Event:ev,Reports:0,'Gross Revenue':0,'Adjustments / Credit Memos':0,'Adjusted Gross Sales':0,'Net Revenue':0,'Net Sales':0,VAT:0,Customers:0,Tickets:0,Discounts:0});return m.get(k)};
  L.forEach(r=>{const ev=r.br==='Events'||!r.mapped?r.ev:'-';const o=ensure(r.ent,r.br,ev);o.Reports++;o['Gross Revenue']=r2(o['Gross Revenue']+r.gross);o['Net Revenue']=r2(o['Net Revenue']+r.net);o.VAT=r2(o.VAT+r.vat);o.Customers+=r.customers;o.Tickets+=r.tickets;o.Discounts=r2(o.Discounts+r.discounts)});
  adjustments.filter(adjustmentInScope).forEach(a=>{a=resolvedAdjustment(a);const ev=a.branch==='Events'?a.event:'-';const o=ensure(a.entity,a.branch,ev);o['Adjustments / Credit Memos']=r2(o['Adjustments / Credit Memos']+(Number(a.amount)||0))});
  return [...m.values()].map(o=>{o['Adjusted Gross Sales']=r2(o['Gross Revenue']+o['Adjustments / Credit Memos']-o.Discounts);o['Net Sales']=r2(o['Net Revenue']+o['Adjustments / Credit Memos']);o['Average Customer Spend']=o.Customers?r2(o['Gross Revenue']/o.Customers):0;return o})
}

async function addAdjustment(){
  if(!await guard())return;
  const entity=$('#adjEnt').value,branch=$('#adjBr').value,event=$('#adjEv').value,date=$('#adjDate').value,type=$('#adjType').value;

  const amount=-Math.abs(raw);
  adjustments.push({id:b64(rnd(9)),entity,branch,event,date,type,description:desc,amount,createdBy:me?me.u:''});
  addLog('Adjustment','', 'Created',type+' | '+desc+' | '+F2(amount)+' for '+entity+' / '+branch+' / '+event+' / '+date);
  saveAll();render();
}
async function delAdjustment(id){
  if(!await guard())return;

}

  clean.forEach(r=>{const mo=String(r.from).slice(0,7);if(!/^\d{4}-\d{2}$/.test(mo))return;if(!bucket.has(mo))bucket.set(mo,{HB:0,HBK:0,LG:0});bucket.get(mo)[nsEntityCode(r.ent)]+=Number(r.adjusted)||0});
  let months=[...bucket.keys()].sort();

  let yMin=Math.min(0,...vals),yMax=Math.max(0,...vals);if(yMax===yMin){yMax=yMin+1}const spread=yMax-yMin;

  months.forEach((m,i)=>{const xx=x(i);svg+='<line x1="'+xx.toFixed(2)+'" y1="'+top+'" x2="'+xx.toFixed(2)+'" y2="'+(top+ph)+'" stroke="#f0f3f7" stroke-width="1"/><text transform="translate('+xx.toFixed(2)+','+(top+ph+22)+') rotate(42)" text-anchor="start" font-size="11" fill="#637286">'+esc(nsMonthLabel(m))+'</text>'});
  entities.forEach((e,ei)=>{

    svg+='<polyline fill="none" stroke="'+colour+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ')+'"/>';
    pts.forEach((pt,i)=>{const v=bucket.get(months[i])?.[e]||0;svg+='<circle cx="'+pt[0].toFixed(2)+'" cy="'+pt[1].toFixed(2)+'" r="4.2" fill="'+colour+'" stroke="#fff" stroke-width="1.5"><title>'+esc(e+' · '+months[i]+' · '+F2(v))+'</title></circle>'});
  });
  const legend=entities.map((e,i)=>'<span style="display:inline-flex;align-items:center;gap:6px;margin:0 14px 6px 0"><i style="display:inline-block;width:24px;height:3px;background:'+pal()[i%pal().length]+'"></i><b>'+e+'</b></span>').join('');
  return '<div class="card"><h3>Monthly Net Sales by Entity</h3><p class="note">Trend line compares HB, HBK and LG by month. Month labels include the year; hover over a point to see its exact sales value. Numeric labels are kept off the line to avoid clutter. It follows the selected date and location filters.</p><div style="width:100%;overflow-x:auto"><svg viewBox="0 0 '+Wd+' '+Ht+'" role="img" aria-label="Monthly net sales line chart" style="display:block;width:100%;min-width:520px;height:auto">'+svg+'</svg></div><div style="margin-top:4px">'+legend+'</div></div>';

function nsManagementSummary(selectedRows){
  const entities=['HB','HBK','LG'];
  const periodRows=(selectedRows||[]).filter(r=>r.mapped&&entities.includes(nsEntityCode(r.ent)));
  const noDate=nsMgmtScopeNoDates().filter(r=>r.mapped&&entities.includes(nsEntityCode(r.ent)));
  const dates=noDate.map(r=>r.from).filter(Boolean).sort();
  const end=flt.dt||dates[dates.length-1]||nsISODate(new Date());
  const month=end.slice(0,7),year=end.slice(0,4),yearStart=year+'-01-01';
  const monthRows=noDate.filter(r=>String(r.from||'').slice(0,7)===month);
  const ytdRows=noDate.filter(r=>r.from>=yearStart&&r.from<=end);
  const entFilter=entities.filter(e=>!flt.ent||nsEntityCode(flt.ent)===e);
  const labelMonth=nsMonthLabel(month),labelYtd='YTD through '+dfmt(end);
  const sections=entFilter.map(e=>{
    const filt=a=>a.filter(r=>nsEntityCode(r.ent)===e);
    const p=filt(periodRows),m=filt(monthRows),y=filt(ytdRows);
    const locCount=new Set(p.map(r=>norm(r.location||r.ev)).filter(Boolean)).size;
    const branchCount=new Set(p.filter(r=>r.br!=='Events'&&r.br&&!/^Unmapped/.test(r.br)).map(r=>r.br)).size;
    const metrics=[{Entity:e,'Selected Period Sales':nsSumAdjusted(p),[labelMonth+' Sales']:nsSumAdjusted(m),[labelYtd]:nsSumAdjusted(y),'Locations':locCount,'Branches':branchCount}];
    const metricCols=['Entity','Selected Period Sales',labelMonth+' Sales',labelYtd,'Locations','Branches'];
    const branchMap=new Map();
    p.forEach(r=>{if(!r.br||r.br==='Events'||/^Unmapped/.test(r.br))return;const key=r.br;branchMap.set(key,(branchMap.get(key)||0)+(Number(r.adjusted)||0))});
    const top=[...branchMap.entries()].map(([Branch,v])=>({Rank:'',Branch,'Net Sales':r2(v)})).sort((a,b)=>b['Net Sales']-a['Net Sales']||a.Branch.localeCompare(b.Branch)).slice(0,3).map((r,i)=>({...r,Rank:String(i+1)}));
    return '<div class="card"><h3>'+esc(e)+' — Management Summary</h3>'+tbl(metrics,metricCols,{max:5})+'<h4 style="margin:16px 0 6px">Top 3 Branches — '+esc(e)+'</h4><p class="note">Ranked by Net Sales for the selected date period. Unmapped branches are excluded.</p>'+tbl(top,['Rank','Branch','Net Sales'],{tot:['Net Sales'],max:3})+'</div>';
  }).join('');
  const notes='<p class="note">Selected Period Sales follows the dashboard date filter. '+esc(labelMonth)+' Sales uses the full calendar month containing '+esc(end)+'. '+esc(labelYtd)+' runs from 1 January through '+esc(end)+'. All location and branch counts are whole numbers.</p>';
  return '<div class="card"><h3>Management Summary — Monthly &amp; YTD Sales</h3>'+notes+'</div>'+sections;
}

function nsMappingHeader(rows){

    const iLoc=col([/^location$/, /^raw location$/, /^netsuite location$/, /location name/]);
    const iEnt=col([/^entity$/, /entity name/]);
    const iBr=col([/^branch$/, /branch name/]);
    const iEv=col([/^event$/, /event name/, /^event location$/, /^location event$/, /event \/ location/, /location \/ event/]);
    const iAcct=col([/^account$/, /account name/, /account number/, /account no/]);
    const iCat=col([/^category$/, /reporting category/, /sales category/]);
    const iKeyword=col([/^keyword$/, /narration keyword/, /memo keyword/, /narration contains/, /^phrase$/]);
    const iNarrEvent=col([/^event$/, /^event name$/, /confirmed event/]);
    if(iLoc>=0&&iEnt>=0&&iBr>=0)return {kind:'location',row:ri,iLoc,iEnt,iBr,iEv};
    if(iAcct>=0&&iCat>=0)return {kind:'category',row:ri,iAcct,iCat};

  }

}
async function nsImportMappingFile(file){
  if(!file)return;if(!await guard())return;
  try{
    let sheets=[];
    if(/\.(xlsx|xlsm|xls)$/i.test(file.name)){
      if(!window.XLSX)throw new Error('Excel reader is unavailable. Reload this HTML file and try again.');
      const wb=await XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array',cellDates:true});
      sheets=wb.SheetNames.map(name=>({name,rows:XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:'',blankrows:false})}));
    }else if(/\.(csv|txt)$/i.test(file.name)){
      const text=await file.text(),d=detectDelim(text),rows=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()).map(x=>splitLine(x,d));sheets=[{name:file.name,rows}];
    }else throw new Error('Use an exported mapping workbook (.xlsx) or mapping CSV.');
    let locN=0,catN=0,narrN=0,cleared=0,recognized=0;
    sheets.forEach(sh=>{
      const hdr=nsMappingHeader(sh.rows);if(!hdr)return;recognized++;
      if(hdr.kind==='location'){
        for(let ri=hdr.row+1;ri<sh.rows.length;ri++){
          const row=sh.rows[ri]||[],raw=sx(row[hdr.iLoc]).replace(/\s+/g,' ').trim();if(!raw)continue;
          const e=sx(row[hdr.iEnt]).trim(),b=sx(row[hdr.iBr]).trim(),ev=hdr.iEv>=0?sx(row[hdr.iEv]).trim():'';const key=norm(raw);
          if(!e||!b){if(maps[key]){delete maps[key];cleared++}continue}
          if(!ents[e])ents[e]=['Events'];if(!ents[e].includes('Events'))ents[e].push('Events');if(!ents[e].includes(b))ents[e].push(b);
          maps[key]={entity:e,branch:b,event:b==='Events'?(ev||titleCase(raw)):'',raw};
          if(b==='Events'&&maps[key].event){evs[e]=evs[e]||[];if(!evs[e].includes(maps[key].event))evs[e].push(maps[key].event)}locN++;
        }
      }else if(hdr.kind==='category'){
        for(let ri=hdr.row+1;ri<sh.rows.length;ri++){
          const row=sh.rows[ri]||[],account=sx(row[hdr.iAcct]).trim();if(!account)continue;const cat=sx(row[hdr.iCat]).trim();
          if(cat)nsCatMap[norm(account)]=cat;else delete nsCatMap[norm(account)];catN++;
        }
      }else if(hdr.kind==='narration'){
        for(let ri=hdr.row+1;ri<sh.rows.length;ri++){
          const row=sh.rows[ri]||[],keyword=sx(row[hdr.iKeyword]).trim(),event=sx(row[hdr.iNarrEvent]).trim();if(!keyword)continue;const key=norm(keyword),idx=(nsNarrationMap||[]).findIndex(x=>norm(x.keyword)===key);
          if(event){if(idx>=0)nsNarrationMap[idx]={keyword,event};else nsNarrationMap.push({keyword,event})}else if(idx>=0)nsNarrationMap.splice(idx,1);narrN++;
        }
      }
    });
    if(!recognized)throw new Error('No supported mapping header found. Location sheet needs Location, Entity and Branch; category sheet needs Account and Category; ');
    nsSaveState();reports.forEach(nsRecalc);const detail=locN+' location mapping(s) updated; '+catN+' account category mapping(s) processed; '+narrN+' narration-to-event rule(s) processed; '+cleared+' location mapping(s) cleared. Locations, accounts and narration rules not listed in the workbook were left unchanged.';secLog('Mapping',file.name,'Imported',detail);addLog('Mapping Import',file.name,'Imported',detail);render();msg('Mapping import complete. '+detail+' See Change Log for the audit trail.',false);
  }catch(e){const detail=String(e&&e.message||e);addLog('Mapping Import',file&&file.name||'','Failed',detail);msg('Mapping import failed: '+detail+' See Change Log.',true)}
}

function nsCmpShift(iso,days){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));if(!m)return iso;const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));d.setDate(d.getDate()+days);return nsISODate(d)}

function nsCmpDefaultAnchor(){

  const dates=nsAll().map(r=>r.from).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort();
  return dates[dates.length-1]||nsISODate(new Date());
}
function nsCmpRanges(mode,anchor){

  if(mode==='month'){
    const month=String(anchor).slice(0,7),first=month+'-01';

function nsFixedISODate(d){
  return String(d.getFullYear()).padStart(4,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nsFixedShift(iso,days){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));
  if(!m)return '';

}
function nsFixedAnchor(){
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(nsCompareAnchor||'')))return nsCompareAnchor;

function nsFixedCmpPool(){

// Mapped reports use only the saved location-to-entity/branch map; no memo is parsed for events.
nsMapped=function(r){
  const m=maps[norm(r.location)]||{};

  const ent=ok?m.entity:'Unmapped',br=ok?m.branch:'Unmapped';
  const ev=ok?(m.branch==='Events'?titleCase(r.location):m.branch):'Unmapped: '+r.location;
  return Object.assign({},r,{mapped:ok,ent,br,ev,narrationEvent:''});
};

function nsCmpSafeDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||''))&&!isNaN(new Date(s+'T12:00:00').getTime())}
function nsCmpRangeDefault(mode){
  const anchor=nsFixedAnchor();
  if(mode==='month')return {start:anchor.slice(0,7)+'-01',end:anchor};
  const d=new Date(anchor+'T12:00:00'),dow=(d.getDay()+6)%7;
  return {start:nsFixedShift(anchor,-dow),end:anchor};
}
function nsCmpShiftMonth(iso,delta){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));if(!m)return '';
  const y=+m[1],mo=+m[2]-1,day=+m[3],targetFirst=new Date(y,mo+delta,1),last=new Date(targetFirst.getFullYear(),targetFirst.getMonth()+1,0).getDate();
  return nsFixedISODate(new Date(targetFirst.getFullYear(),targetFirst.getMonth(),Math.min(day,last)));
}
function nsCmpUserRanges(){
  const def=nsCmpRangeDefault(nsCompareMode),start=nsCompareStart||def.start,end=nsCompareEnd||def.end;
  if(!nsCmpSafeDate(start)||!nsCmpSafeDate(end)||start>end)return {invalid:true,start,end};
  const pstart=nsCompareMode==='month'?nsCmpShiftMonth(start,-1):nsFixedShift(start,-7);
  const pend=nsCompareMode==='month'?nsCmpShiftMonth(end,-1):nsFixedShift(end,-7);
  return {current:{start,end,label:'Current: '+nsCmpDateLabel(start)+' – '+nsCmpDateLabel(end)},previous:{start:pstart,end:pend,label:'Previous: '+nsCmpDateLabel(pstart)+' – '+nsCmpDateLabel(pend)}};
}
nsCmpPool=function(){
  return nsAll().filter(r=>{
    const e=nsEntityCode(r.ent);
    if(!r.mapped||!['HB','HBK','LG'].includes(e)||!nsCmpSafeDate(r.from))return false;
    if(nsCmpEntityFilter&&e!==nsCmpEntityFilter)return false;
    if(nsCmpBranchFilter&&String(r.br||'')!==nsCmpBranchFilter)return false;
    if(nsCmpLocationFilter&&String(r.location||'')!==nsCmpLocationFilter)return false;
    return true;
  });
};
function nsCmpBuildData(ranges,pool){
  const currentTotal=nsFixedCmpMoney(pool,ranges.current.start,ranges.current.end),previousTotal=nsFixedCmpMoney(pool,ranges.previous.start,ranges.previous.end);
  const entities=['HB','HBK','LG'].filter(e=>!nsCmpEntityFilter||e===nsCmpEntityFilter).map(e=>{
    const a=pool.filter(r=>nsEntityCode(r.ent)===e),c=nsFixedCmpMoney(a,ranges.current.start,ranges.current.end),p=nsFixedCmpMoney(a,ranges.previous.start,ranges.previous.end);
    return {Entity:e,[ranges.current.label]:c,[ranges.previous.label]:p,Variance:r2(c-p),'Change %':nsCmpPct(c,p)};
  });
  entities.push({Entity:'TOTAL',[ranges.current.label]:currentTotal,[ranges.previous.label]:previousTotal,Variance:r2(currentTotal-previousTotal),'Change %':nsCmpPct(currentTotal,previousTotal)});
  const gm=new Map();pool.forEach(r=>{
    const key=[nsEntityCode(r.ent),r.br||'',r.location||''].join('|');
    let g=gm.get(key);if(!g){g={Entity:nsEntityCode(r.ent),Branch:r.br||'',Location:r.location||'',current:0,previous:0};gm.set(key,g)}
    const a=Number(r.adjusted)||0;if(r.from>=ranges.current.start&&r.from<=ranges.current.end)g.current+=a;if(r.from>=ranges.previous.start&&r.from<=ranges.previous.end)g.previous+=a;
  });
  const branches=[...gm.values()].filter(g=>g.current||g.previous).map(g=>({Entity:g.Entity,Branch:g.Branch,Location:g.Location,[ranges.current.label]:r2(g.current),[ranges.previous.label]:r2(g.previous),Variance:r2(g.current-g.previous),'Change %':nsCmpPct(g.current,g.previous)})).sort((a,b)=>Number(b[ranges.current.label])-Number(a[ranges.current.label]));
  return {currentTotal,previousTotal,entities,branches,variance:r2(currentTotal-previousTotal)};
}

  if(!nsCmpSafeDate(start)||!nsCmpSafeDate(end)||start>end)return controls+'<div class="card"><p class="em">Invalid date range. Choose an end date on or after the start date.</p></div>';

  return controls+'<div class="grid">'+kpi('Current Period Sales',F2(data.currentTotal),ranges.current.label)+kpi('Previous Period Sales',F2(data.previousTotal),ranges.previous.label)+kpi('Variance',F2(data.variance),nsCmpPct(data.currentTotal,data.previousTotal)+' change')+'</div>'+

   '<div class="card"><h3>Branch / Location Comparison</h3><p class="note">One row per entity, branch and NetSuite location.</p>'+(data.branches.length?tbl(data.branches,['Entity','Branch','Location',ranges.current.label,ranges.previous.label,'Variance','Change %'],{tot:[ranges.current.label,ranges.previous.label,'Variance'],max:3000}):'<p class="em">No branch/location activity in these periods.</p>')+'</div>';

/* =====================================================================
   EXECUTIVE REPORTING UPDATE
   1) Net Sales is Credit - Debit on sales accounts only.
      Total GL Credit / Debit still include all GL accounts for audit.
   2) Date filters are applied explicitly to avoid rerendering while typing.
   3) Comparison includes visual entity comparisons and custom date windows.
   4) KPI / top-branch / category drill-through to GL transactions.
   5) Management Excel pack and print-to-PDF report.
   ===================================================================== */

/* Financial basis: never add cash, receivables, tax or other balancing accounts into Net Sales. */
nsRecalc = function(R){
  const lines=R.lines||[];
  let gross=0,microsSales=0,invoiceSales=0,creditMemo=0,journalAdj=0,netSales=0,vat=0,svc=0,totalDebit=0,totalCredit=0,salesDebit=0,salesCredit=0;
  const docs=new Set(),customers=new Set(),cats=new Map();
  lines.forEach(x=>{
    const debit=Number(x.debit)||0,credit=Number(x.credit)||0;
    const signed=x.useCreditDebit===true?r2(credit-debit):r2(Number(x.amount)||r2(credit-debit));
    // If the source had both Debit and Credit columns, Credit - Debit is authoritative.
    x.amount=r2(signed);
    totalDebit+=debit;totalCredit+=credit;vat+=Number(x.tax)||0;svc+=Number(x.svc)||0;
    const sale=nsSalesAccount(x.account),t=x.type,amt=x.amount;
    if(sale){
      netSales+=amt;salesDebit+=debit;salesCredit+=credit;
      if(t==='Micros'){microsSales+=amt;gross+=amt}
      else if(t==='Invoice'){invoiceSales+=amt;gross+=amt}
      else if(t==='Credit Memo')creditMemo+=amt;
      else if(t==='Journal')journalAdj+=amt;
      const category=nsCategory(x.account,x.category),catKey=norm(x.account)+'|'+category;
      let c=cats.get(catKey);
      if(!c)c={account:x.account||'',category,micros:0,invoice:0,gross:0,cm:0,journal:0,net:0,qty:0,credit:0,debit:0,lines:0};
      c.net+=amt;c.credit+=credit;c.debit+=debit;c.lines++;
      if(t==='Micros'){c.micros+=amt;c.gross+=amt;c.qty+=Number(x.qty)||0}
      else if(t==='Invoice'){c.invoice+=amt;c.gross+=amt;c.qty+=Number(x.qty)||0}
      else if(t==='Credit Memo')c.cm+=amt;
      else if(t==='Journal')c.journal+=amt;
      cats.set(catKey,c);
      if((t==='Micros'||t==='Invoice'||t==='Credit Memo')&&x.doc)docs.add(x.doc);
      if(x.customer)customers.add(x.customer);
    }
    // Tax and service charge are tracked separately only when supplied by the source.
    if(!x.tax&&/\b(vat|tax)\b/i.test(String(x.account||'')))vat+=amt;
    if(!x.svc&&/service\s*charge/i.test(String(x.account||'')))svc+=amt;
  });
  R.microsSales=r2(microsSales);R.invoiceSales=r2(invoiceSales);R.gross=r2(gross);
  R.creditMemo=r2(creditMemo);R.journalAdj=r2(journalAdj);
  R.net=r2(netSales);R.adjusted=r2(netSales); // compatibility alias for old screens; displayed label is now Net Sales.
  R.totalDebit=r2(totalDebit);R.totalCredit=r2(totalCredit);R.salesAccountDebit=r2(salesDebit);R.salesAccountCredit=r2(salesCredit);
  R.vat=r2(vat);R.svc=r2(svc);R.tickets=docs.size;R.customers=customers.size||docs.size;

function nsV2BuildManagementData(selectedRows){

/* Import quality: count invalid rows and log them with each upload, without pop-up dialogs. */
nsImportFile = async function(f){
  const name=f.name||'';let rows;
  if(/\.(xlsx|xlsm|xls)$/i.test(name)){if(!window.XLSX)throw new Error('Excel reader is not available. Reload this HTML file.');const wb=await XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:'array',cellDates:true});rows=nsRowsFromWorkbook(wb)}
  else if(/\.(csv|txt)$/i.test(name))rows=nsRowsFromText(await f.text());
  else throw new Error('Only NetSuite GL Excel/CSV files are supported.');
  const hd=nsHeader(rows);if(!hd)throw new Error('NetSuite GL headers were not found. Required fields include Date, Location and Account.');
  const h=hd.h,parsed=[],q={rowsRead:0,skipped:0,invalidDate:0,missingLocation:0,missingAccount:0,blankOrZero:0};
  const idx=patterns=>nsFindCol(h,patterns),iDate=idx([/^date$/, /posting date/, /transaction date/, /business date/]),iLoc=idx([/^location$/, /location name/, /^outlet$/, /^branch$/]),iAcct=idx([/^account$/, /account name/, /account number/, /account no/]);
  for(let i=hd.row+1;i<rows.length;i++){
    const row=rows[i]||[];if(!row.some(v=>String(v==null?'':v).trim()!==''))continue;q.rowsRead++;
    const x=nsSourceLine(row,i,h,name);
    if(!x){q.skipped++;if(iDate<0||!nsDate(row[iDate]))q.invalidDate++;if(iLoc<0||!String(row[iLoc]||'').trim())q.missingLocation++;if(iAcct<0||!String(row[iAcct]||'').trim())q.missingAccount++;continue}
    if(x.amount!==0||x.tax!==0||x.svc!==0)parsed.push(x);else q.blankOrZero++;
  }
  Object.defineProperty(parsed,'_quality',{value:q,enumerable:false,configurable:true});
  if(!parsed.length)throw new Error('No usable NetSuite GL rows. Read '+q.rowsRead+' row(s); skipped '+q.skipped+' (invalid/missing dates '+q.invalidDate+', missing location '+q.missingLocation+', missing account '+q.missingAccount+', zero/blank amount '+q.blankOrZero+').');
  return parsed;
};
nsHandle = async function(files,opt){
  opt=opt||{};files=[...files];if(!files.length||!can(2))return [];
  const out=[],errs=[];let totalLines=0,newReports=0,mergedReports=0,duplicateLines=0,readRows=0,skippedRows=0,invalidDates=0,missingLocations=0,missingAccounts=0;
  for(let fi=0;fi<files.length;fi++){
    const f=files[fi];msg('Processing '+(fi+1)+' of '+files.length+': '+f.name);
    try{
      const rows=await nsImportFile(f),q=rows._quality||{},groups=new Map();readRows+=q.rowsRead||0;skippedRows+=q.skipped||0;invalidDates+=q.invalidDate||0;missingLocations+=q.missingLocation||0;missingAccounts+=q.missingAccount||0;
      rows.forEach(x=>{const key=norm(x.location)+'|'+x.date;const a=groups.get(key)||{location:x.location,date:x.date,lines:[]};a.lines.push(x);groups.set(key,a)});
      let fileAdded=0,fileDup=0,fileMergedGroups=0;
      groups.forEach(g=>{
        const id='NETSUITE|'+norm(g.location)+'|'+g.date;let R=reports.find(r=>r.id===id);
        if(!R){R={id,src:'NetSuite',raw:g.location,key:norm(g.location),location:g.location,from:g.date,to:g.date,files:[],lines:[]};reports.push(R);R._new=true;newReports++}
        const sig=new Set((R.lines||[]).map(nsLineSig));let add=0,dup=0;
        g.lines.forEach(x=>{const signature=nsLineSig(x);if(!sig.has(signature)){sig.add(signature);R.lines.push(x);add++}else dup++});
        if(!R.files.includes(f.name))R.files.push(f.name);if(add>0&&!R._new){mergedReports++;fileMergedGroups++}
        nsRecalc(R);totalLines+=add;fileAdded+=add;fileDup+=dup;duplicateLines+=dup;R.file=R.files.join(', ');R._new=false;
      });
      const state=fileAdded===0?'Duplicate':(fileDup?'Loaded with duplicates':'Loaded');
      const detail='NetSuite GL: '+q.rowsRead+' data row(s) read; '+rows.length+' usable line(s); '+groups.size+' location/date group(s); '+fileAdded+' new unique line(s); '+fileDup+' identical duplicate line(s) ignored; '+(q.skipped||0)+' rows skipped (invalid date '+(q.invalidDate||0)+', missing location '+(q.missingLocation||0)+', missing account '+(q.missingAccount||0)+').';
      addLog('Upload',f.name,state,detail);out.push({name:f.name,ok:true,rows:rows.length,groups:groups.size,added:fileAdded,duplicates:fileDup,quality:q});
    }catch(e){const detail=String(e&&e.message||e);errs.push(f.name+': '+detail);addLog('Upload',f.name,'Failed',detail);out.push({name:f.name,ok:false,err:detail})}
  }
  const summary='NetSuite GL upload: '+out.filter(x=>x.ok).length+'/'+files.length+' file(s) read; '+newReports+' new location/date report(s); '+mergedReports+' existing report(s) expanded; '+totalLines+' unique GL line(s) added; '+duplicateLines+' duplicate line(s) ignored; '+skippedRows+' invalid/required-field row(s) skipped.'+(errs.length?' '+errs.length+' file(s) failed; see Change Log.':' See Change Log for file-by-file detail.');
  addLog('Upload Summary',files.map(f=>f.name).join(', '),errs.length?'Completed with errors':'Completed',summary+(errs.length?' | Errors: '+errs.join(' | '):'')+' | Rows read '+readRows+'; invalid date '+invalidDates+'; missing location '+missingLocations+'; missing account '+missingAccounts+'.');
  changed();render();msg(summary,errs.length>0);return out;
};

/* Comparison ranges: selectable first day of week and Week / Month / Quarter / Half-year comparisons. */
let nsWeekStartDay=1;
try{const saved=Number(LS('hbk_ns_week_start'));if(Number.isInteger(saved)&&saved>=0&&saved<=6)nsWeekStartDay=saved}catch(e){}
function nsPeriodISO(d){return String(d.getFullYear()).padStart(4,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nsPeriodAddDays(iso,n){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));if(!m)return '';const d=new Date(+m[1],+m[2]-1,+m[3]);d.setDate(d.getDate()+n);return nsPeriodISO(d)}
function nsPeriodAddMonths(iso,n){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));if(!m)return '';const y=+m[1],mo=+m[2]-1,day=+m[3],first=new Date(y,mo+n,1),last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();first.setDate(Math.min(day,last));return nsPeriodISO(first)}
function nsPeriodRangeDefault(mode){
  const anchor=nsFixedAnchor(),p=anchor.split('-').map(Number),y=p[0],m=p[1],d=p[2];let start=anchor;
  if(mode==='week'){const dow=new Date(y,m-1,d).getDay();start=nsPeriodAddDays(anchor,-((dow-nsWeekStartDay+7)%7))}
  else if(mode==='month')start=String(y)+'-'+String(m).padStart(2,'0')+'-01';
  else if(mode==='quarter'){const sm=Math.floor((m-1)/3)*3+1;start=String(y)+'-'+String(sm).padStart(2,'0')+'-01'}
  else if(mode==='halfyear'){start=String(y)+(m<=6?'-01-01':'-07-01')}
  return {start,end:anchor};
}
function nsPeriodRangeLabels(start,end,tag){return tag+' · '+dfmt(start)+' – '+dfmt(end)}
nsCmpRangeDefault=function(mode){return nsPeriodRangeDefault(mode||nsCompareMode)};
nsCmpUserRanges=function(){
  const def=nsPeriodRangeDefault(nsCompareMode),start=nsCompareStart||def.start,end=nsCompareEnd||def.end;
  if(!nsCmpSafeDate(start)||!nsCmpSafeDate(end)||start>end)return {invalid:true,current:{start,end,label:'Current period'},previous:{start:'',end:'',label:'Previous period'}};
  const shift=nsCompareMode==='week'?7:nsCompareMode==='month'?1:nsCompareMode==='quarter'?3:6;
  const priorShift=(iso)=>nsCompareMode==='week'?nsPeriodAddDays(iso,-7):nsPeriodAddMonths(iso,-shift);
  const ps=priorShift(start),pe=priorShift(end);
  const tag=nsCompareMode==='week'?'Week to Week':nsCompareMode==='month'?'Month to Month':nsCompareMode==='quarter'?'Quarter to Quarter':'Half-yearly';
  return {invalid:false,current:{start,end,label:nsPeriodRangeLabels(start,end,'Current')},previous:{start:ps,end:pe,label:nsPeriodRangeLabels(ps,pe,'Previous')},mode:tag};
};
nsFixedCmpMoney=function(rows,start,end){return r2((rows||[]).reduce((sum,r)=>sum+(r.from>=start&&r.from<=end?(Number(r.net)||0):0),0))};
nsCmpBuildData=function(ranges,pool){
  const currentTotal=nsFixedCmpMoney(pool,ranges.current.start,ranges.current.end),previousTotal=nsFixedCmpMoney(pool,ranges.previous.start,ranges.previous.end),entities=['HB','HBK','LG'].filter(e=>!nsCmpEntityFilter||e===nsCmpEntityFilter).map(e=>{const a=pool.filter(r=>nsEntityCode(r.ent)===e),c=nsFixedCmpMoney(a,ranges.current.start,ranges.current.end),p=nsFixedCmpMoney(a,ranges.previous.start,ranges.previous.end);return {Entity:e,[ranges.current.label]:c,[ranges.previous.label]:p,Variance:r2(c-p),'Change %':nsCmpPct(c,p)}});
  entities.push({Entity:'TOTAL',[ranges.current.label]:currentTotal,[ranges.previous.label]:previousTotal,Variance:r2(currentTotal-previousTotal),'Change %':nsCmpPct(currentTotal,previousTotal)});
  const map=new Map();(pool||[]).forEach(r=>{const k=[nsEntityCode(r.ent),r.br||'',r.location||''].join('|');let g=map.get(k);if(!g){g={Entity:nsEntityCode(r.ent),Branch:r.br||'',Location:r.location||'',current:0,previous:0};map.set(k,g)}const v=Number(r.net)||0;if(r.from>=ranges.current.start&&r.from<=ranges.current.end)g.current+=v;if(r.from>=ranges.previous.start&&r.from<=ranges.previous.end)g.previous+=v});
  const branches=[...map.values()].filter(g=>g.current||g.previous).map(g=>({Entity:g.Entity,Branch:g.Branch,Location:g.Location,[ranges.current.label]:r2(g.current),[ranges.previous.label]:r2(g.previous),Variance:r2(g.current-g.previous),'Change %':nsCmpPct(g.current,g.previous)})).sort((a,b)=>Number(b[ranges.current.label])-Number(a[ranges.current.label]));
  return {currentTotal,previousTotal,variance:r2(currentTotal-previousTotal),entities,branches};
};

  function nsStdDate(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));return m?new Date(+m[1],+m[2]-1,+m[3]):new Date()}

async function nsBudgetImportFile(file){
  if(!file)return;
  if(!await guard())return;
  if(!window.XLSX){nsBudgetDownloadFailure('Excel reader unavailable. Reload the application and try again.');return}
  let stage='opening workbook';
  try{
    const input=await file.arrayBuffer();
    const wb=await XLSX.read(input,{type:'array'});
    if(!wb||typeof wb!=='object')throw new Error('Excel reader did not return a workbook. Re-save the file as .xlsx and try again.');
    const sheets=wb.Sheets&&typeof wb.Sheets==='object'?wb.Sheets:{};
    const sheetNames=Array.isArray(wb.SheetNames)?wb.SheetNames:Object.keys(sheets);
    if(!sheetNames.length)throw new Error('No worksheets were found in this workbook.');
    stage='locating Branch Budget worksheet';
    let sheet='';
    for(const n of sheetNames){if(/branch budget/i.test(String(n||''))){sheet=n;break}}
    if(!sheet)sheet=sheetNames[0]||'';
    if(!sheet||!sheets[sheet])throw new Error('Could not read the selected worksheet. Sheets found: '+sheetNames.join(', '));
    stage='reading worksheet rows';
    if(!XLSX.utils||typeof XLSX.utils.sheet_to_json!=='function')throw new Error('Excel worksheet reader is unavailable. Reload the complete application.');
    const converted=XLSX.utils.sheet_to_json(sheets[sheet],{header:1,raw:true,defval:null,blankrows:false});
    const rows=Array.isArray(converted)?converted:[];
    if(rows.length<2)throw new Error('Worksheet "'+sheet+'" contains no budget data rows.');
    stage='validating budget headers';
    const headers=(rows[0]||[]).map(v=>String(v==null?'':v).trim());
    const col=re=>headers.findIndex(h=>re.test(h));
    const iy=col(/^year$/i),ie=col(/^entity$/i),ib=col(/^branch$/i);
    if(ie<0||ib<0)throw new Error('Required columns Entity and Branch were not found in row 1. Keep the standard Branch Budget headings.');
    const monthMatchers=[/^(jan|january)\b/i,/^(feb|february)\b/i,/^(mar|march)\b/i,/^(apr|april)\b/i,/^(may)\b/i,/^(jun|june)\b/i,/^(jul|july)\b/i,/^(aug|august)\b/i,/^(sep|sept|september)\b/i,/^(oct|october)\b/i,/^(nov|november)\b/i,/^(dec|december)\b/i];
    const monthCols=[];
    headers.forEach((h,i)=>monthMatchers.forEach((re,mi)=>{if(re.test(h)&&!monthCols.some(x=>x.month===mi))monthCols.push({col:i,month:mi})}));
    if(!monthCols.length)throw new Error('No month columns found. Use Jan–Dec or January–December, optionally followed by "(AED Millions)".');
    stage='matching branches and reading amounts';
    const activePairs=Array.isArray(nsBudgetPairs())?nsBudgetPairs():[];
    const normBranch=x=>norm(String(x||'').trim());
    const stripEntityPrefix=(branch,entity)=>String(branch||'').trim().replace(new RegExp('^'+String(entity).replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+'\\s*[-–—:|]\\s*','i'),'').trim();
    const matchedBranch=(entity,branch)=>{
      const exact=activePairs.find(p=>nsEntityCode(p&&p.Entity)===entity&&normBranch(p.Branch)===normBranch(branch));
      if(exact)return String(exact.Branch).trim();
      const bNoPrefix=normBranch(stripEntityPrefix(branch,entity));
      if(bNoPrefix){const found=activePairs.filter(p=>nsEntityCode(p&&p.Entity)===entity&&(normBranch(p.Branch)===bNoPrefix||normBranch(stripEntityPrefix(p.Branch,entity))===bNoPrefix));if(found.length===1)return String(found[0].Branch).trim()}
      const candidates=activePairs.filter(p=>nsEntityCode(p&&p.Entity)===entity&&(normBranch(stripEntityPrefix(branch,entity))===normBranch(p.Branch)||normBranch(branch)===normBranch(stripEntityPrefix(p.Branch,entity))));
      return candidates.length===1?String(candidates[0].Branch).trim():'';
    };
    const known=new Set(activePairs.map(p=>nsBudgetKey(0,p.Entity,p.Branch)));
    const existing=Array.isArray(nsBudgetData())?nsBudgetData():[];
    const store=new Map(existing.map(r=>[nsBudgetKey(r.year,r.entity,r.branch),Object.assign({},r,{months:Array.from({length:12},(_,i)=>nsBudgetValue(r,i))})]));
    let validRows=0,updatedCells=0,skippedRows=0,nonblankRows=0,unmatchedRows=0;
    const issues=[],unmatched=new Set(),seenRows=new Set();
    stage='validating budget branch rows';
    rows.slice(1).forEach((row,ri)=>{
      const safe=Array.isArray(row)?row:[];
      const originalEntity=String(safe[ie]??'').trim();
      const entity=nsEntityCode(originalEntity);
      const originalBranch=String(safe[ib]??'').trim();
      const year=String(iy>=0&&safe[iy]!=null&&String(safe[iy]).trim()?safe[iy]:nsBudgetCurrentYear()).trim();
      if(!entity&&!originalBranch)return;
      const hasMonth=monthCols.some(mc=>safe[mc.col]!==null&&safe[mc.col]!==undefined&&String(safe[mc.col]).trim()!=='');
      if(hasMonth)nonblankRows++;
      if(!/^\d{4}$/.test(year)||!entity||!originalBranch){skippedRows++;issues.push('Row '+(ri+2)+': missing or invalid Year, Entity or Branch.');return}
      if(!['HB','HBK','LG'].includes(entity)){skippedRows++;issues.push('Row '+(ri+2)+': entity "'+originalEntity+'" is not HB, HBK or LG; row skipped.');return}
      const mappedName=matchedBranch(entity,originalBranch);
      // Keep valid budget rows even if their branch is not currently mapped. This preserves the workbook amounts;
      // the row is logged so it can be mapped later and will not be silently discarded.
      const branch=mappedName||originalBranch;
      if(!mappedName&&!known.has(nsBudgetKey(0,entity,originalBranch))){unmatchedRows++;unmatched.add(entity+' / '+originalBranch);}
      const key=nsBudgetKey(year,entity,branch);
      if(seenRows.has(key)){issues.push('Row '+(ri+2)+': duplicate '+entity+' / '+branch+' / '+year+'; nonblank month values will update the same budget row.');}
      seenRows.add(key);
      let record=store.get(key);
      if(!record)record={year:Number(year),entity,branch,months:Array(12).fill(null)};
      let rowCells=0;
      monthCols.forEach(mc=>{
        const raw=safe[mc.col];
        if(raw===null||raw===undefined||String(raw).trim()==='')return; // blank cells leave existing values unchanged
        const v=typeof raw==='number'?raw:Number(String(raw).replace(/,/g,'').replace(/AED/ig,'').trim());
        if(!Number.isFinite(v)){issues.push('Row '+(ri+2)+', '+NS_BUDGET_MONTHS[mc.month][1]+': non-numeric budget value; cell ignored.');return}
        // Template amounts are AED millions. Eight decimal places preserve AED cents (e.g. 1.31144511 = AED 1,311,445.11).
        record.months[mc.month]=Number(v.toFixed(8));
        rowCells++;updatedCells++;
      });
      if(rowCells){store.set(key,record);validRows++}
    });
    if(!updatedCells){
      const why=nonblankRows===0?'No monthly budget figures were found in the workbook.':'No valid numeric monthly budget values could be imported.';
      throw new Error(why+' The import made no changes. Confirm the file uses AED millions (e.g. 1.31144511 = AED 1,311,445.11), and that Year, Entity, Branch and Jan–Dec columns are present.');
    }
    stage='saving budget values';
    const next=Array.from(store.values()).map(r=>({year:Number(r.year),entity:nsEntityCode(r.entity),branch:String(r.branch),months:Array.from({length:12},(_,i)=>nsBudgetValue(r,i))}));
    const nextYear=String(Math.max(...next.map(r=>Number(r.year)||0))||nsBudgetCurrentYear());
    nsBudgets=next;nsBudgetYear=nextYear;
    const unmatchNote=unmatchedRows?' '+unmatchedRows+' branch row(s) were kept but are not currently mapped: '+[...unmatched].slice(0,10).join(', ')+'.':'';
    const detail=validRows+' branch-year row(s); '+updatedCells+' month value(s) updated; '+skippedRows+' invalid row(s) skipped.'+(issues.length?' '+issues.slice(0,10).join(' | '):'')+unmatchNote;
    addLog('Budget Import',file.name,(issues.length||skippedRows||unmatchedRows)?'Imported with warnings':'Imported',detail);
    changed();stage='refreshing budget display';
    try{render()}catch(renderError){addLog('Budget Display','','Warning','Budget figures saved, but the view could not refresh automatically: '+String(renderError&&renderError.message||renderError));}
    msg('Budget import complete: '+updatedCells+' monthly value(s) updated across '+validRows+' branch-year row(s).'+(unmatchedRows?' '+unmatchedRows+' row(s) were retained but are not currently mapped; see Logs.':'')+(issues.length||skippedRows?' Review Logs for warnings.':''),(issues.length||skippedRows||unmatchedRows)?true:false);
  }catch(e){
    const detail='Stage: '+stage+'. '+String(e&&e.message||e);
    addLog('Budget Import',file.name,'Failed',detail);
    msg('Budget import failed at '+stage+'. '+String(e&&e.message||e)+' See Logs for details.',true);
  }
}

/* ===== Management reliability, consistent display scale and actionable controls ===== */
let nsMonthCompareBasis='mtd';
let nsComparePeriodChoice='';
function nsUiScale(){return (CFG().printSalesScale||'millions')}
function nsUiScaleFactor(){const s=nsUiScale();return s==='millions'?1000000:s==='thousands'?1000:1}
function nsUiScaleLabel(){const s=nsUiScale();return s==='millions'?'AED millions (M)':s==='thousands'?'AED thousands (K)':'AED'}
function nsUiMoney(v){const n=Number(v)||0;return (n/nsUiScaleFactor()).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function nsUiSalesNumber(v){const n=Number(v)||0;return Math.abs(n/nsUiScaleFactor())>=1000?(n/nsUiScaleFactor()).toLocaleString('en-AE',{maximumFractionDigits:1}):(n/nsUiScaleFactor()).toLocaleString('en-AE',{maximumFractionDigits:2})}
function nsScaleTitle(h){return String(h||'').replace(/\s*\(AED\s*(?:M|Millions?|K|Thousands?)\)/i,'').trim()+' ('+(nsUiScale()==='millions'?'AED M':nsUiScale()==='thousands'?'AED K':'AED')+')'}
function nsScaleColumnKind(h,activeTab){
  const label=String(h||'').trim();
  // Percentages, quantities, counts, and GL audit debit/credit table columns are not sales amounts.
  if(/%|change/i.test(label)&&/%/.test(label))return null;
  if(/^(?:Total )?(?:GL )?(?:Credit|Debit)$/i.test(label)||/^(?:Debit|Credit|Total Debit|Total Credit)$/i.test(label))return null;
  if(/^(?:rank|locations?|branches|entities|reports|lines|tickets|customers|invoices|quantity|month|period|date|entity|branch|location|category|name)$/i.test(label)||/\bbudgeted branches\b/i.test(label))return null;
  const explicitMillions=/\bAED\s*(?:M|Millions?)\b/i.test(label);
  const explicitThousands=/\bAED\s*(?:K|Thousands?)\b/i.test(label);
  const moneyColumn=/(?:sales|revenue|adjustment|variance|budget|actual)/i.test(label)
    ||/^ytd\b/i.test(label)
    ||/^selected\s+period\b/i.test(label)
    ||(activeTab==='cmp'&&/^(current|previous)\b/i.test(label));
  if(!moneyColumn)return null;
  return {from:explicitMillions?'millions':explicitThousands?'thousands':'actual',title:nsScaleTitle(label)};
}
function nsApplySummaryDisplayScale(){
  if(!document||!document.getElementById('view'))return;
  const root=document.getElementById('view'),activeTab=String(tab||''),settings=nsUiScale();
  const summaryTabs=['dash','cmp','cat','reg'];
  if(!summaryTabs.includes(activeTab))return;
  const currentFactor=nsUiScaleFactor();
  const numRe=/^-?\s*[\d,]+(?:\.\d+)?\s*$/;
  // Tables are rendered from unscaled AED values; budget tables explicitly mark values in M/K.
  // Keep a pristine numeric value on each rendered cell, then always display it using the current Super Admin setting.
  root.querySelectorAll('table').forEach(table=>{
    if(table.dataset.nsScalePreserved==='1')return;
    const head=table.querySelector('thead tr');if(!head)return;
    const headers=[...head.children],cols=[];let touched=false;
    headers.forEach((th,i)=>{
      const original=th.dataset.nsScaleOriginal||th.textContent.trim();
      const kind=nsScaleColumnKind(original,activeTab);
      if(!kind){cols[i]=null;return;}
      th.dataset.nsScaleOriginal=original;
      th.textContent=kind.title;
      cols[i]=kind;touched=true;
    });
    if(!touched)return;
    table.querySelectorAll('tbody tr,tfoot tr').forEach(tr=>[...tr.children].forEach((td,i)=>{
      const kind=cols[i];if(!kind)return;
      let raw=td.dataset.nsScaleRaw;
      if(raw===undefined){
        const text=(td.textContent||'').trim();
        if(!numRe.test(text))return;
        raw=text.replace(/,/g,'').trim();td.dataset.nsScaleRaw=raw;
      }
      const numeric=Number(raw);if(!Number.isFinite(numeric))return;
      const sourceFactor=kind.from==='millions'?1e6:kind.from==='thousands'?1e3:1;
      const shown=(numeric*sourceFactor)/currentFactor;
      td.textContent=shown.toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2});
      td.dataset.nsScaledTo=settings;
    }));
  });
  // Scale monetary KPI cards, including total credit/debit cards, but leave counts, dates and percentages untouched.
  root.querySelectorAll('.k,.ns-clickkpi,.kpi').forEach(el=>{
    const lab=el.querySelector('small')?.textContent?.trim()||el.getAttribute('aria-label')||'';
    const isMoney=/(sales|revenue|adjustment|variance|budget|actual|credit|debit|amount)/i.test(lab)&&!/%/.test(lab);
    if(!isMoney||/^(locations?|branches|entities|reports|lines|tickets|customers|invoices|dates?|active locations?|active branches?|active entities?)$/i.test(lab))return;
    const b=el.querySelector('b');if(!b)return;
    let raw=b.dataset.nsScaleRaw;
    if(raw===undefined){const text=(b.textContent||'').trim();if(!numRe.test(text))return;raw=text.replace(/,/g,'').trim();b.dataset.nsScaleRaw=raw}
    const n=Number(raw);if(!Number.isFinite(n))return;
    b.textContent=(n/currentFactor).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2});
    b.dataset.nsScaledTo=settings;
  });
  // Numeric labels next to bar charts and comparison bars are generated in AED by the source views.
  root.querySelectorAll('.br b,.ns-compare-label b').forEach(b=>{
    let raw=b.dataset.nsScaleRaw;
    if(raw===undefined){const text=(b.textContent||'').trim();if(!numRe.test(text))return;raw=text.replace(/,/g,'').trim();b.dataset.nsScaleRaw=raw}
    const n=Number(raw);if(!Number.isFinite(n))return;
    b.textContent=(n/currentFactor).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2});
    b.dataset.nsScaledTo=settings;
  });
  // Dashboard main donut values in SVG are also scaled below by pie(); avoid modifying unrelated SVG labels.
  let note=root.querySelector('.ns-scale-note');
  if(!note){note=document.createElement('div');note.className='ns-scale-note';root.insertBefore(note,root.firstChild)}
  note.textContent='Monetary figures are displayed in '+nsUiScaleLabel()+'. Calculations and raw transaction exports remain in AED.';
}
function nsKpiBasisText(label){
  const l=String(label||'').toLowerCase();
  if(l.includes('net sales'))return 'Net Sales uses Credit − Debit for sales-account lines when both GL columns are present; amount-only rows retain their signed source amount. It includes Micros, invoice sales, sales-related credit memos and sales-related journal entries. Cash, receivables, VAT, service charge and other balancing accounts are excluded. Negative credit-memo or journal movements reduce Net Sales.';
  if(l.includes('micros'))return 'Micros Sales = signed Credit − Debit movements posted to sales accounts on Micros/POS transaction lines. It is reported separately and is included in Net Sales.';
  if(l.includes('invoice'))return 'Invoice Sales = signed Credit − Debit movements posted to sales accounts on invoice lines. It is reported separately and is included in Net Sales.';
  if(l.includes('variance'))return 'Variance = current-period Net Sales − comparison-period Net Sales. Variance % is calculated against the absolute comparison-period amount; when the comparison amount is zero, the percentage is not meaningful.';
  if(l.includes('budget')||l.includes('actual'))return 'Budget variance = actual sales-account Net Sales less the uploaded budget for the same period. A missing budget is shown as not uploaded, not as a genuine zero budget. Budget template input is in AED millions.';
  if(l.includes('branch'))return 'Active branch counts exclude Events and unmapped branches, and require sales activity in the selected period.';
  if(l.includes('entity'))return 'Active entity counts include HB, HBK and LG only when mapped sales activity exists in the selected period.';
  return 'This KPI summarizes the selected period and active filters. Open GL Transaction Details to inspect the included sales-account lines and the Credit − Debit calculation.';
}

/* Anchored period selection: weeks can be picked by any date; months can be MTD or full-month; quarter/half-year select a defined period. */
function nsIsoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nsDateLocal(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));return m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3])):new Date()}
function nsAddLocalDays(d,n){const out=new Date(d.getFullYear(),d.getMonth(),d.getDate());out.setDate(out.getDate()+n);return out}
function nsMonthLastDay(y,m){return new Date(y,m+1,0).getDate()}
function nsBuildSelectedComparisonRanges(){
  const mode=String(nsCompareMode||'week'),today=nsIsoLocal(new Date()),anchor=nsDateLocal(nsCompareAnchor||today),anchorISO=nsIsoLocal(anchor);let cs,ce,ps,pe,label;
  if(mode==='week'){
    const weekStart=Number.isFinite(Number(nsWeekStartDay))?Number(nsWeekStartDay):1,offset=(anchor.getDay()-weekStart+7)%7;
    cs=nsAddLocalDays(anchor,-offset);ce=nsAddLocalDays(cs,6);ps=nsAddLocalDays(cs,-7);pe=nsAddLocalDays(ce,-7);label='Week to Week';
  }else if(mode==='month'){
    const y=anchor.getFullYear(),m=anchor.getMonth(),prevFirst=new Date(y,m-1,1),curFirst=new Date(y,m,1);
    if(nsMonthCompareBasis==='full'){
      cs=curFirst;ce=new Date(y,m+1,0);ps=prevFirst;pe=new Date(y,m,0);
    }else{
      const elapsed=anchor.getDate();cs=curFirst;ce=anchor;ps=prevFirst;pe=new Date(prevFirst.getFullYear(),prevFirst.getMonth(),Math.min(elapsed,nsMonthLastDay(prevFirst.getFullYear(),prevFirst.getMonth())));
    }
    label=nsMonthCompareBasis==='full'?'Full Month to Full Previous Month':'Month-to-date vs Same Elapsed Days';
  }else if(mode==='quarter'){
    const sel=String(nsComparePeriodChoice||'');let y=anchor.getFullYear(),q=Math.floor(anchor.getMonth()/3)+1;const qm=/^(\d{4})-Q([1-4])$/.exec(sel);if(qm){y=Number(qm[1]);q=Number(qm[2])}const startMonth=(q-1)*3;cs=new Date(y,startMonth,1);ce=new Date(y,startMonth+3,0);ps=new Date(y,startMonth-3,1);pe=new Date(y,startMonth,0);label='Quarter to Quarter';
  }else{
    const sel=String(nsComparePeriodChoice||'');let y=anchor.getFullYear(),half=anchor.getMonth()<6?1:2;const hm=/^(\d{4})-H([12])$/.exec(sel);if(hm){y=Number(hm[1]);half=Number(hm[2])}const startMonth=half===1?0:6;cs=new Date(y,startMonth,1);ce=new Date(y,startMonth+6,0);ps=new Date(y,startMonth-6,1);pe=new Date(y,startMonth,0);label='Half-yearly';
  }
  const asISO=d=>nsIsoLocal(d),curStart=asISO(cs),curEnd=asISO(ce),prevStart=asISO(ps),prevEnd=asISO(pe);
  const dateLabel=(a,b)=>dfmt(a)+' – '+dfmt(b);
  return {invalid:false,mode:label,current:{start:curStart,end:curEnd,label:'Current '+label+' · '+dateLabel(curStart,curEnd)},previous:{start:prevStart,end:prevEnd,label:'Previous '+label+' · '+dateLabel(prevStart,prevEnd)}};
}
const nsOriginalCmpUserRangesForSuggestions=nsCmpUserRanges;
nsCmpUserRanges=function(){return nsBuildSelectedComparisonRanges()};
function nsComparePeriodSelectHTML(){
  const mode=String(nsCompareMode||'week'),today=new Date(),years=new Set([today.getFullYear()-2,today.getFullYear()-1,today.getFullYear(),today.getFullYear()+1]);
  (nsAll()||[]).forEach(r=>{const y=Number(String(r.from||'').slice(0,4));if(y>1900)years.add(y)});
  const ys=[...years].sort((a,b)=>a-b),periods=[];
  if(mode==='quarter')ys.forEach(y=>[1,2,3,4].forEach(q=>periods.push({v:y+'-Q'+q,t:y+' · Q'+q})));
  else ys.forEach(y=>[1,2].forEach(h=>periods.push({v:y+'-H'+h,t:y+' · H'+h})));
  if(!nsComparePeriodChoice||!periods.some(p=>p.v===nsComparePeriodChoice))nsComparePeriodChoice=periods.find(p=>p.v===nsIsoLocal(today).slice(0,4)+'-'+(mode==='quarter'?'Q'+(Math.floor(today.getMonth()/3)+1):'H'+(today.getMonth()<6?1:2)))?.v||periods[periods.length-1]?.v||'';
  return '<label>Period<select onchange="nsComparePeriodChoice=this.value;render()">'+periods.map(p=>'<option value="'+p.v+'"'+(p.v===nsComparePeriodChoice?' selected':'')+'>'+p.t+'</option>').join('')+'</select></label>';
}
(function(){
  const oldCmp=V.cmp;

    let html=oldCmp.apply(this,arguments);

    if(mode==='week'||mode==='month')controls+='<label>Anchor date<input type="date" value="'+esc(nsCompareAnchor)+'" onchange="nsCompareAnchor=this.value;render()"></label>';
